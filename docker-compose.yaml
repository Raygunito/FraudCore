services:
  kafka-broker:
    image: apache/kafka:4.3.1
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init-topics
    depends_on:
      - kafka-broker
    volumes:
      - ./kafka:/kafka
    entrypoint: [ "/bin/bash", "/kafka/init-topics.sh" ]

  kafdrop:
    image: obsidiandynamics/kafdrop:4.2.0
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka-broker:29092
    depends_on:
      - kafka-broker

  spark:
    image: apache/spark:4.0.3-python3
    container_name: spark-streaming
    depends_on: [ kafka-broker, kafka-init ]
    user: root
    restart: on-failure
    volumes:
      - ./spark-streaming:/app
      - ./data:/data
    working_dir: /app
    command: /opt/spark/bin/spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.3 main.py

  dashboard:
    build: ./dashboard
    container_name: fraudcore-dashboard
    depends_on: [ kafka-broker, kafka-init ]
    ports:
      - "8501:8501"
    environment:
      KAFKA_BOOTSTRAP: kafka-broker:29092
    volumes:
      - ./dashboard:/app
